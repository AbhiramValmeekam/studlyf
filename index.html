<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/scraped/s77_stud.png" />
    <link rel="apple-touch-icon" href="/scraped/s77_stud.png" />
    <meta name="theme-color" content="#08080A" />
    <!-- Blocking classic script: it must run before the first paint, so no defer/async/module.
         Kept external so the app can be served under `script-src 'self'` with no inline-script
         exemption. See public/theme-init.js for why this exists at all. -->
    <script src="/theme-init.js"></script>
    <style>
      /* Colour the canvas before the app stylesheet arrives (Vite injects globals.css as a
         JS-driven <style> in dev, so nothing would paint a background yet).
         IMPORTANT: this must go on <body>, NEVER on <html>. The app's WebGL backdrops sit at
         z-index:-10, so they paint in step 2 of the root stacking context while <body>'s own
         background paints at step 3 — above them. They are visible only because <html> has no
         background, which lets <body>'s background propagate to the canvas and leaves <body>
         painted as transparent. Give <html> a background and that propagation stops, <body>
         paints opaque, and it covers every backdrop.
         Values mirror --ink in globals.css: dark 8 8 10 = #08080a, light 247 247 244. */
      body { background: #08080a; }
      html[data-theme='light'] body { background: #f7f7f4; }
    </style>
    <title>STUDLYF — Build. Prove. Get Discovered.</title>
    <meta
      name="description"
      content="STUDLYF is where builders find real opportunities, prove their work, and get discovered. Hackathons, internships, fellowships, and the resources to win them."
    />
    <meta property="og:title" content="STUDLYF — Build. Prove. Get Discovered." />
    <meta
      property="og:description"
      content="Where builders find real opportunities, prove their work, and get discovered."
    />
    <meta property="og:type" content="website" />
    <!-- Clash Display (headline) is self-hosted locally with font-display:block, so preload
         the hero weights to paint the real face immediately — no fallback-font flash. -->
    <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/clash-display-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=jetbrains-mono@400,500&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,400;1,500&family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
